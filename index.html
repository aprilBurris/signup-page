<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tay's Etiquette Club</title>
</head>
<body>
<header>
    <h1>Welcome to Tay's Etiquette Club</h1>
    <p>Information Meeting Sign-up</p>
</header>

<nav>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#signup">Sign-Up</a></li>
    </ul>
</nav>

<main>
    <section id="home" class="box">
      <h2>Who We are?</h2>
      <p>write one or two sentences about club</p>
      <button type="about">About</button>
   </section>
   <section id="about">
      <h2>About Program</h2>
      <p>write one or two sentences about club</p>
      <button type="signup">Go Sign Up</button>
   </section>
   <section id="signup">
      <h2>Sign-Up</h2>
      <p>create a form for users to sign up for the program</p>
      <form>
        <label for="parentname">Parent Name:</label>
        <input type="text" id="parentname" name="parentname" required placeholder="Enter your full name">
        <label for="parentemail">Parent Email:</label>
        <input type="email" id="parentemail" name="parentemail" required placeholder="Enter your email address">
        <label for="phonenumber">Parent Phone Number:</label>
        <input type="tel" id="phonenumber" name="phonenumber" required placeholder="Enter your phone number">
        <button type="submit">Sign Up</button>
      </form>
   </section>

</main>

<footer>
    <p>Made by April Burris</p>
   </footer>
</body>
</html>
